server:
  port: 8080

logging:
  level:
    root: INFO
    com.demo: DEBUG
    com.xzb: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    path: ./logs

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/xialingying?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai

    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  profiles:
    active: local
  application:
    name: demo
  ai:
    dashscope:
      # 百炼/DashScope API Key，文本对话+图片生成/识别+TTS 共用这一个
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${AI_MODEL:qwen-max}
      embedding:
        enabled: true
        options:
          model: text-embedding-v3    # 百炼嵌入模型

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-name: ${MAIL_FROM_NAME:微信Bot助手}
    rate-limit-count: ${MAIL_RATE_LIMIT_COUNT:3}
    rate-limit-minutes: ${MAIL_RATE_LIMIT_MINUTES:10}

ai:
  # 对话记忆
  memory:
    file: ${AI_MEMORY_FILE:./data/conversation-memory.json}
  # 周期回复任务
  periodic-reply:
    file: ${PERIODIC_REPLY_FILE:./data/periodic-replies.json}
  # 系统提示词
  system-prompt: |
    你是一个友好的微信助手，用简洁的中文回复，不要超过200字。

    【最高优先级规则 — 猎聘投递关键词】
    当用户要求猎聘投递时，keyword 参数必须100%使用用户原话，这是硬性规定：
    - 用户说"销售"你就搜"销售"，用户说"商务"你就搜"商务"
    - 即使简历内容是技术背景，也绝对禁止改成技术关键词
    - 即使你认为用户更适合其他岗位，也绝对禁止修改
    - 用户可能想转行，这不是你需要判断的，你只需要执行
    违反此规则会导致用户投递到完全错误的岗位！

    你拥有以下能力，根据用户意图自行决定是否使用：
    1. 生成图片 — 当用户说「生成/画/制作一张...」时使用 generateImage 工具
    2. 语音回复 — 当用户说「用语音回复/读出来/讲给我听/念一下/播报/发语音/说给我听」
    等任何想要"听"的表达时，先用文字思考回复内容，然后调用 voiceReply 工具
    把回复内容朗读出来
    3. 查天气 — 当用户问天气时使用 getWeather 工具,当用户让用语音回复天气时，把查询的天气信息调用voiceReply工具把天气读出来
    4. 查时间 — 当用户问几点/日期时使用 getCurrentTime 工具
    5. 联网搜索 — 当用户询问新闻、考试分数线、政策、股票、赛事、产品信息等需要实时数据或最新消息时，使用 search 工具
    6. 发送邮件 — 当用户要求发送邮件、把内容发到邮箱、记录备忘时使用 sendEmail 工具
    7. 定时任务 — 当用户说「X点提醒我」「Y点给我发天气」「过N分钟后...」「定时发送」等涉及未来时间执行的操作时，使用 createTask 工具创建定时任务
    8. 猎聘求职 — 当用户要求在猎聘搜索/投递岗位时使用 liepinSearchJobs/liepinBatchApply。
       投递前必须先调用 liepinLoginCheck 确认登录状态。
       keyword 必须严格等于用户原话中的岗位名（见顶部最高优先级规则）。

  # 图片生成（百炼 DashScope）
  image:
    model: ${IMAGE_MODEL:wanx2.0-t2i-turbo}
    size: ${IMAGE_SIZE:1024x1024}

  # 图片识别（百炼兼容模式）
  vision:
    model: ${VISION_MODEL:qwen-vl-max}
    prompt: ${VISION_PROMPT:请用中文简洁描述这张图片的主要内容，如果图片中有文字也请读出来。}

  # 语音服务
  voice:
    # ASR 语音识别（仍然走 SiliconFlow OkHttp 直调）
    asr:
      api-key: ${VOICE_ASR_API_KEY:}
      api-url: ${VOICE_ASR_API_URL:https://api.siliconflow.cn}
      model: ${VOICE_ASR_MODEL:FunAudioLLM/SenseVoiceSmall}
      timeout: ${VOICE_ASR_TIMEOUT:60s}
    # TTS 语音合成（已切百炼 DashScope，Key 走 spring.ai.dashscope.api-key）
    tts:
      model: ${TTS_MODEL:cosyvoice-v3-flash}
      voice: ${TTS_VOICE:longanyang}
    # 音频编解码（SILK ↔ PCM）
    audio:
      silk-decoder-path: ${VOICE_SILK_DECODER_PATH:}
      silk-encoder-path: ${VOICE_SILK_ENCODER_PATH:}
      process-timeout: ${VOICE_AUDIO_PROCESS_TIMEOUT:30s}
    #联网搜索
    search:
      baidu:
        api-key: ${BAIDU_SEARCH_API_KEY:}
        api-url: ${BAIDU_SEARCH_API_URL:https://qianfan.baidubce.com/v2/ai_search/web_search}
        timeout: ${BAIDU_SEARCH_TIMEOUT:15s}

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 开启 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略
      id-type: auto
      # 逻辑删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 实体类包扫描
  type-aliases-package: com.demo.demo.model